# Render Blueprint — deploys this app as a free Static Site.
# In Render: New + → Blueprint → connect this repo. Or create a Static Site
# manually with the build command and publish directory below.
services:
  - type: web
    runtime: static
    name: worldcup-2026-family-bracket
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # SPA fallback so refreshing any path serves the app.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
